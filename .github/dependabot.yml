version: 2
updates:
  # Scan NuGet manifests recursively, including public examples and test rigs.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    # Routine releases settle for a week; security-update PRs bypass cooldown.
    cooldown:
      default-days: 7
    groups:
      nuget-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      nuget-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
    # Major upgrades and security fixes remain separate PRs for clear assessment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
